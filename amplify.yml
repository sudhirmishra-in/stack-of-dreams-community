version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pin Node from .nvmrc. The default build image ships Node 22.18, which is older than some dev dependencies need.
        - nvm install
        - nvm use
        - node --version
        - npm ci
    build:
      commands:
        # Quality gate: if lint or any test fails, the build fails and Amplify keeps serving the previous deployment.
        - npm run lint
        - npm test
        # VITE_* values come from Amplify "Environment variables" (public identifiers only, never secrets).
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
# Security headers live in customHttp.yml (Amplify does not read them from this file).

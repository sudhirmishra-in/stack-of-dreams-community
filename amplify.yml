version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # VITE_* values come from Amplify "Environment variables" (public identifiers only, never secrets).
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
# Security headers. The CSP starts in REPORT-ONLY mode so a missed origin cannot break sign-in or the map;
# check the browser console for violations, then rename the header to Content-Security-Policy (docs/amplify-dns.md).
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
      - key: Content-Security-Policy-Report-Only
        value: >-
          default-src 'self';
          script-src 'self' 'sha256-X+XOwlK6WyQjQzOfjOPjZEhPkafPLcIIfAOGV5ID3xw=';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self' data:;
          connect-src 'self' https://*.lambda-url.us-east-1.on.aws https://*.lambda-url.us-east-2.on.aws https://cognito-idp.us-east-2.amazonaws.com https://*.auth.us-east-2.amazoncognito.com;
          worker-src 'self' blob:;
          child-src blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none'

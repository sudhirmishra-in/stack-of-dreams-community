[project]
name = "community-navigator-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "strands-agents>=1.0",
  # Required for spans to reach CloudWatch (AgentCore Observability). Without it `opentelemetry-instrument` runs but exports nothing.
  "aws-opentelemetry-distro>=0.18.0",
  "bedrock-agentcore>=1.0",
  "boto3>=1.40",
  "pydantic>=2.8",
]

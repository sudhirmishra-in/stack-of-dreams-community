[project]
name = "navigator"
version = "0.1.0"
description = "Community Resource Navigator pilot platform: ingestion, search, quotas, gateway, agents"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
  "pydantic>=2.8",
  "PyJWT[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "moto[dynamodb]>=5", "pytest-timeout>=2"]
agent = ["strands-agents>=1.0", "bedrock-agentcore>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
